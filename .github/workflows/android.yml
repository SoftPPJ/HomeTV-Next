name: HomeTV Next - build test APK

on:
  # APK builds are manual-only. Source commits must never publish a test release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK identity and file
        run: |
          APK=app/build/outputs/apk/debug/HomeTV-Next-V1-debug.apk
          test -s "$APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | grep -E "package: name='com.softppj.myhometv.next'|application-label:'My Home TV Next'"
      - name: Publish test prerelease with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: next-v1-test-${{ github.run_number }}
          name: HomeTV Next V1 - Test ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: app/build/outputs/apk/debug/HomeTV-Next-V1-debug.apk
          fail_on_unmatched_files: true
