name: HomeTV Next - build test APK

on:
  # Build and verify the debug APK for development changes; never publish a release.
  push:
    branches:
      - new-app-v1-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK identity and file
        run: |
          APK=app/build/outputs/apk/debug/HomeTV-Next-V1-debug.apk
          test -s "$APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | grep -F "package: name='com.softppj.myhometv.next'"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | grep -F "application-label:'My Home TV Next'"
      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeTV-Next-V1-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/HomeTV-Next-V1-debug.apk
          if-no-files-found: error
          retention-days: 14
