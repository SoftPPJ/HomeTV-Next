name: HomeTV Next - build APK and optionally publish prerelease

on:
  push:
    branches:
      - fix/remote-playback-diagnostics-2026-11-07
  workflow_dispatch:
    inputs:
      publish_apk:
        description: "Publish a prerelease only after explicit owner approval"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Verify playback engine dependency versions
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon --console=plain > playback-dependencies.txt
          grep -Fq 'androidx.media3:media3-exoplayer:1.11.1' playback-dependencies.txt
          grep -Fq 'org.videolan.android:libvlc-all:3.5.1' playback-dependencies.txt
          grep -Fq 'io.github.anilbeesetti:nextlib-media3ext:1.11.1-0.17.0' playback-dependencies.txt
      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Prefetch every Robolectric SDK used by tests
        shell: bash
        run: |
          set -euo pipefail
          DEST="app/build/robolectric-deps"
          mkdir -p "$DEST"
          VERSIONS=(
            "9-robolectric-4913185-2-i7"
            "12.1-robolectric-8229987-i7"
            "15-robolectric-12650502-i7"
          )
          for VERSION in "${VERSIONS[@]}"; do
            ARTIFACT="android-all-instrumented-$VERSION.jar"
            BASE_URL="https://repo.maven.apache.org/maven2/org/robolectric/android-all-instrumented/$VERSION"
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 600 \
              "$BASE_URL/$ARTIFACT" --output "$DEST/$ARTIFACT"
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 \
              "$BASE_URL/$ARTIFACT.sha256" --output "$RUNNER_TEMP/$VERSION.sha256"
            EXPECTED="$(tr -d '[:space:]' < "$RUNNER_TEMP/$VERSION.sha256")"
            if [[ ! "$EXPECTED" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "::error::Maven Central returned an invalid SHA-256 checksum for $ARTIFACT."
              exit 1
            fi
            echo "$EXPECTED  $DEST/$ARTIFACT" | sha256sum --check
            test -s "$DEST/$ARTIFACT"
          done
          test -s "$DEST/android-all-instrumented-9-robolectric-4913185-2-i7.jar"
          test -s "$DEST/android-all-instrumented-12.1-robolectric-8229987-i7.jar"
          test -s "$DEST/android-all-instrumented-15-robolectric-12650502-i7.jar"
          ls -lh "$DEST"
          echo "All pinned Robolectric SDK artifacts are downloaded and verified."
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK identity and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/HomeTV-Next-V1-debug.apk
          test -s "$APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | grep -F "package: name='com.softppj.myhometv.next'"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | grep -F "application-label:'My Home TV Next'"
          sha256sum "$APK" | tee "$APK.sha256"
      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeTV-Next-V1-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/HomeTV-Next-V1-debug.apk
            app/build/outputs/apk/debug/HomeTV-Next-V1-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified APK as prerelease
        if: inputs.publish_apk == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: next-v1-test-${{ github.run_number }}
          name: HomeTV Next V1 - Prerelease #${{ github.run_number }}
          body: |
            Automated test build for My Home TV Next.
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

            This is a prerelease for testing, not a stable production release.
          prerelease: true
          draft: false
          files: |
            app/build/outputs/apk/debug/HomeTV-Next-V1-debug.apk
            app/build/outputs/apk/debug/HomeTV-Next-V1-debug.apk.sha256
