name: HomeTV V6 source compilation (no APK release)

on:
  push:
    branches:
      - my-home-tv-v6-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out V6 development sources
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile Kotlin sources only (do not package or upload an APK)
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace
