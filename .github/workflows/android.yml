name: HomeTV V6 debug test APK

on:
  push:
    branches:
      - my-home-tv-v6-development
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out V6 development sources
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile V6 Kotlin sources
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Package V6 debug test APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify V6 APK was assembled
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk
          test "$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | wc -l)" -ge 1

      - name: Publish V6 APK as GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)
          test -n "$APK"
          cp "$APK" HomeTV-V6-debug.apk
          TAG="hometv-v6-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" HomeTV-V6-debug.apk \
            --title "HomeTV V6 - Test Build ${GITHUB_RUN_NUMBER}" \
            --notes "Development debug APK from commit ${GITHUB_SHA}. Device testing required." \
            --target "${GITHUB_SHA}" \
            --prerelease
