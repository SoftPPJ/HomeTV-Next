name: MyTV V1 compile and test only

on:
  push:
    branches:
      - new-app-v1-development
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "Using Android SDK at $ANDROID_HOME"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
