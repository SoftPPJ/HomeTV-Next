name: HomeTV-Next source compile and unit tests

on:
  push:
    branches:
      - new-app-v1-development
      - fix/remote-vlc-regression-2026-11-07
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hometv-next-source-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "Using Android SDK at $ANDROID_HOME"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Verify playback engine dependency versions
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon --console=plain > playback-dependencies.txt
          cat playback-dependencies.txt
          grep -Fq 'androidx.media3:media3-exoplayer:1.11.1' playback-dependencies.txt
          grep -Fq 'org.videolan.android:libvlc-all:3.5.1' playback-dependencies.txt
          grep -Fq 'io.github.anilbeesetti:nextlib-media3ext:1.11.1-0.17.0' playback-dependencies.txt
      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Prefetch every Robolectric SDK used by tests
        shell: bash
        run: |
          set -euo pipefail
          DEST="app/build/robolectric-deps"
          mkdir -p "$DEST"
          DEPS_FILE="$DEST/robolectric-deps.properties"
          : > "$DEPS_FILE"
          # API 28 is pinned by M3uParserTest, SignedLicenseCacheTest and
          # YouTubeStreamResolverTest. API 32 is the app target SDK and is
          # used by Robolectric tests without an explicit @Config SDK.
          VERSIONS=(
            "9-robolectric-4913185-2-i7"
            "12.1-robolectric-8229987-i7"
          )
          for VERSION in "${VERSIONS[@]}"; do
            ARTIFACT="android-all-instrumented-$VERSION.jar"
            BASE_URL="https://repo.maven.apache.org/maven2/org/robolectric/android-all-instrumented/$VERSION"
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 600 \
              "$BASE_URL/$ARTIFACT" --output "$DEST/$ARTIFACT"
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 \
              "$BASE_URL/$ARTIFACT.sha256" --output "$RUNNER_TEMP/$VERSION.sha256"
            EXPECTED="$(tr -d '[:space:]' < "$RUNNER_TEMP/$VERSION.sha256")"
            if [[ ! "$EXPECTED" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "::error::Maven Central returned an invalid SHA-256 checksum for $ARTIFACT."
              exit 1
            fi
            echo "$EXPECTED  $DEST/$ARTIFACT" | sha256sum --check
            test -s "$DEST/$ARTIFACT"
            # PropertiesDependencyResolver maps the full Maven coordinate
            # directly to this verified file, avoiding filename/path lookup
            # differences in LocalDependencyResolver.
            printf 'org.robolectric\\:android-all-instrumented\\:%s=%s/%s\\n' "$VERSION" "$PWD/$DEST" "$ARTIFACT" >> "$DEPS_FILE"
          done
          cat "$DEPS_FILE"
          test "$(wc -l < "$DEPS_FILE")" -eq "${#VERSIONS[@]}"
          ls -lh "$DEST"
          echo "All pinned Robolectric SDK artifacts are verified and mapped."
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
