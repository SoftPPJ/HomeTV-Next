name: HomeTV Next compile check

# Deliberately manual-only: source pushes must not consume Actions quota.
# A manually requested run compiles, tests, and creates a debug-only APK artifact for device testing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "Using Android SDK at $ANDROID_HOME"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble debug test APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug test APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeTV-Next-V1-debug-test
          path: app/build/outputs/apk/debug/HomeTV-Next-V1-debug.apk
          if-no-files-found: error
          retention-days: 7
