name: MyTV V1 compile and test only

on:
  push:
    branches:
      - new-app-v1-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "Using Android SDK at $ANDROID_HOME"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: HomeTV-Next-V1-debug
          path: app/build/outputs/apk/debug/HomeTV-Next-V1-debug.apk
          if-no-files-found: error
          retention-days: 14
