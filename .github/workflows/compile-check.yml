name: HomeTV Next compile check

# Deliberately manual-only while the user has asked to avoid builds/artifacts.
# This prevents source pushes from consuming Actions quota or uploading APKs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "Using Android SDK at $ANDROID_HOME"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/HomeTV-Next-V1-debug.apk
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeTV-Next-V1-debug
          path: app/build/outputs/apk/debug/HomeTV-Next-V1-debug.apk
          if-no-files-found: error
          retention-days: 14
