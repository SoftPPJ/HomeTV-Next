name: HomeTV-Next source compile and unit tests

on:
  push:
    branches:
      - new-app-v1-development
      - fix/remote-vlc-regression-2026-11-07
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hometv-next-source-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "Using Android SDK at $ANDROID_HOME"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Verify playback engine dependency versions
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon --console=plain > playback-dependencies.txt
          cat playback-dependencies.txt
          grep -Fq 'androidx.media3:media3-exoplayer:1.11.1' playback-dependencies.txt
          grep -Fq 'org.videolan.android:libvlc-all:3.5.1' playback-dependencies.txt
          grep -Fq 'io.github.anilbeesetti:nextlib-media3ext:1.11.1-0.17.0' playback-dependencies.txt
      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
