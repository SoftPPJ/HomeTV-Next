name: HomeTV-Next source compile and unit tests

on:
  push:
    branches:
      - new-app-v1-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "Using Android SDK at $ANDROID_HOME"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Verify playback engine dependency versions
        shell: bash
        run: |
          set -euo pipefail
          media3="$(gradle :app:dependencyInsight --dependency media3-exoplayer --configuration debugRuntimeClasspath --no-daemon --console=plain)"
          libvlc="$(gradle :app:dependencyInsight --dependency libvlc-all --configuration debugRuntimeClasspath --no-daemon --console=plain)"
          nextlib="$(gradle :app:dependencyInsight --dependency nextlib-media3ext --configuration debugRuntimeClasspath --no-daemon --console=plain)"
          printf '%s\n' "$media3" "$libvlc" "$nextlib"
          grep -Fq 'androidx.media3:media3-exoplayer:1.11.1' <<< "$media3"
          grep -Fq 'org.videolan.android:libvlc-all:3.7.7' <<< "$libvlc"
          grep -Fq 'io.github.anilbeesetti:nextlib-media3ext:1.11.1-0.17.0' <<< "$nextlib"
      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
